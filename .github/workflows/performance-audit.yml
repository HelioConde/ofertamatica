name: Ofertamatica Production Lighthouse

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Ofertamatica V2 Production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ofertamatica-production-lighthouse
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sumario Lighthouse com fixtures
        run: node scripts/test-summarize-lighthouse.mjs
      - name: Testar validacao de HTML sem rede
        run: python3 -m unittest discover -s scripts -p 'test_check_production_html.py'

      - name: Check Chrome and production (retry full HTML validation)
        run: |
          google-chrome --version
          mkdir -p performance
          ready=0
          for attempt in 1 2 3 4; do
            echo "Verificando HTML de produção: tentativa $attempt/4."
            if curl --fail --location --compressed --silent --show-error \
              --connect-timeout 15 --max-time 30 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              --header 'Accept: text/html' \
              https://ofertamatica.com.br/ \
              --output /tmp/ofertamatica-production.html; then
              if python3 scripts/check-production-html.py \
                /tmp/ofertamatica-production.html \
                "performance/production-readiness-$attempt.json"; then
                ready=1
                echo "Produção confirmada na tentativa $attempt." >> "$GITHUB_STEP_SUMMARY"
                break
              fi
            else
              echo "::warning::Solicitação HTTPS falhou na tentativa $attempt."
            fi
            if [ "$attempt" -lt 4 ]; then sleep "$((attempt * 4))"; fi
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error title=Produção indisponível ou inesperada::As quatro tentativas não retornaram HTML válido da aplicação. Verifique os relatórios production-readiness-N.json; Lighthouse não foi executado."
            echo "Falha de disponibilidade/identidade após quatro tentativas; não confundir com score Lighthouse." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Install Lighthouse
        run: npm install --no-save --no-audit --no-fund lighthouse@12

      - name: Audit mobile
        run: |
          mkdir -p performance
          ./node_modules/.bin/lighthouse https://ofertamatica.com.br/ \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=performance/mobile.json --quiet

      - name: Audit desktop
        run: |
          ./node_modules/.bin/lighthouse https://ofertamatica.com.br/ \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=performance/desktop.json --quiet

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f performance/mobile.json ] && [ -f performance/desktop.json ]; then
            node scripts/summarize-lighthouse.mjs performance/mobile.json performance/desktop.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Auditoria Lighthouse" >> "$GITHUB_STEP_SUMMARY"
            echo "Um dos relatórios não foi gerado. Consulte o log para detalhes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofertamatica-lighthouse-production
          path: performance/
          if-no-files-found: warn
          retention-days: 30
