name: Ofertamatica Production Lighthouse

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Ofertamatica V2 Production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: ofertamatica-production-lighthouse
  cancel-in-progress: true

jobs:
  audit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar sumario Lighthouse com fixtures
        run: node scripts/test-summarize-lighthouse.mjs

      - name: Check Chrome and production
        run: |
          google-chrome --version
          # Falhas temporárias de rede são tentadas novamente; o texto do H1 pode mudar
          # com atualizações editoriais, sem representar indisponibilidade real.
          curl --fail --location --compressed --silent --show-error \
            --retry 5 --retry-delay 4 --retry-all-errors \
            --max-time 30 https://ofertamatica.com.br/ \
            --output /tmp/ofertamatica-production.html
          python3 - <<'PY'
          from pathlib import Path
          import unicodedata
          body = Path("/tmp/ofertamatica-production.html").read_text(encoding="utf-8",errors="replace")
          body = "".join(c for c in unicodedata.normalize("NFKD",body.lower()) if not unicodedata.combining(c))
          if "<html" not in body or "ofertamatica" not in body:
              raise SystemExit("Página inesperada na produção (HTML/identidade não encontrados).")
          print("PASS: produção responde com HTML da Ofertamática; Lighthouse verificará a experiência renderizada.")
          PY

      - name: Install Lighthouse
        run: npm install --no-save --no-audit --no-fund lighthouse@12

      - name: Audit mobile
        run: |
          mkdir -p performance
          ./node_modules/.bin/lighthouse https://ofertamatica.com.br/ \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=performance/mobile.json --quiet

      - name: Audit desktop
        run: |
          ./node_modules/.bin/lighthouse https://ofertamatica.com.br/ \
            --preset=desktop \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=performance/desktop.json --quiet

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f performance/mobile.json ] && [ -f performance/desktop.json ]; then
            node scripts/summarize-lighthouse.mjs performance/mobile.json performance/desktop.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Auditoria Lighthouse" >> "$GITHUB_STEP_SUMMARY"
            echo "Um dos relatórios não foi gerado. Consulte o log para detalhes." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofertamatica-lighthouse-production
          path: performance/
          if-no-files-found: warn
          retention-days: 30
