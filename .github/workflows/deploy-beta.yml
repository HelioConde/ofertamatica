name: Deploy Ofertamatica V2 Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# FTP não é transacional: interromper upload pode deixar index.html apontando
# para assets ainda não enviados. Nunca cancelar um deploy que já iniciou.
concurrency:
  group: ofertamatica-v2-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check SEO scripts syntax
        run: |
          node --check scripts/generate-seo-pages.mjs
          node --check scripts/validate-build.mjs
          node --check scripts/verify-live-seo.mjs
          node --check scripts/verify-live-assets.mjs
          node --check scripts/check-ftp-assets.mjs

      - name: Build
        run: npm run build

      - name: Validate production build
        run: npm run check:build

      # Deploy imutável/seguro:
      # 1) envia os assets com hash primeiro e preserva os antigos;
      # 2) só depois troca index.html e demais arquivos de raiz.
      # Isso evita que o HTML aponte para JS/CSS que ainda não existem no FTP.
      - name: Deploy assets first
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "dist/assets"
          remoteDir: "public_html/assets"
          # Assets têm hash no nome: imutáveis. Evita retransmitir centenas de MB
          # a cada publicação e sobrecarregar a hospedagem compartilhada.
          # Sem flag experimental: reproduz o comportamento que já passou em produção.

      # Se o FTP de terceiros não enviou todos os hashes, confere e reenvia
      # diretamente, com diagnóstico distinto entre FTP e entrega HTTP/CDN.
      - name: Install FTP diagnostic client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Verify and repair immutable assets on FTP
        env:
          FTP_HOST: ${{ secrets.HOST }}
          FTP_USER: ${{ secrets.USER }}
          FTP_PASSWORD: ${{ secrets.PASS }}
        run: node scripts/check-ftp-assets.mjs

      # Só publique o HTML quando JS/CSS do novo build já estiverem no domínio.
      - name: Verify newly uploaded JS/CSS before switching HTML
        run: node scripts/verify-live-assets.mjs --assets-only

      - name: Deploy app shell after assets
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "dist"
          remoteDir: "public_html"
          options: "--exclude-glob assets --exclude-glob assets/** --exclude-glob beta --exclude-glob beta/**"

      - name: Verify deployed HTML and JavaScript
        run: node scripts/verify-live-assets.mjs --html-and-assets

      - name: Verify deployed SEO URLs
        run: node scripts/verify-live-seo.mjs
