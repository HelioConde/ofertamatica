name: Ofertamatica Design Quality

on:
  pull_request:
    paths:
      - 'apps/validade-zero/**'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/probe-public-access.py'
      - 'scripts/test_probe_public_access.py'
      - '.github/workflows/public-crawl-health.yml'
      - 'scripts/validate-seo-graph.mjs'
      - 'scripts/validate-validade-zero.mjs'
      - 'scripts/qa-interactions.mjs'
      - 'src/**'
      - 'scripts/qa-design-guidelines.mjs'
      - 'scripts/audit-content.mjs'
      - 'scripts/qa-release-print-import.mjs'
      - 'package.json'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - '.github/workflows/design-quality.yml'
  push:
    branches: [main]
    paths:
      - 'apps/validade-zero/**'
      - 'scripts/generate-seo-pages.mjs'
      - 'scripts/probe-public-access.py'
      - 'scripts/test_probe_public_access.py'
      - '.github/workflows/public-crawl-health.yml'
      - 'scripts/validate-seo-graph.mjs'
      - 'scripts/validate-validade-zero.mjs'
      - 'scripts/qa-interactions.mjs'
      - 'src/**'
      - 'scripts/qa-design-guidelines.mjs'
      - 'package.json'
      - '.github/workflows/design-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Check PHP analytics endpoints
        run: |
          php -l public/api/telemetria.php
          php -l public/api/modelos-populares.php
      - name: Verificar diagnóstico de acesso externo sem rede
        run: python3 -m unittest discover -s scripts -p 'test_probe_public_access.py'
      - name: Build and validate
        run: npm run verify
      - name: Validade Zero unit tests (local, scanner and login)
        working-directory: apps/validade-zero
        env:
          CI: 'true'
        run: npm test -- --watchAll=false
      - name: Review indexable content quality
        run: npm run audit:content
      - name: Install browser testing dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 5183 > /tmp/ofertamatica-design-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5183/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ofertamatica-design-preview.log
          exit 1
      - name: Capture seasonal posters on desktop and mobile
        run: |
          mkdir -p artifacts/design-audit
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright'
          const browser = await chromium.launch({ headless: true })
          for (const [name, viewport] of [['desktop', {width: 1440, height: 900}], ['mobile', {width: 390, height: 844}]]) {
            const page = await browser.newPage({ viewport, deviceScaleFactor: 1 })
            await page.goto('http://127.0.0.1:5183/placas-sazonais/', {waitUntil:'networkidle'})
            await page.locator('.curated-model-grid .model-showcase-card').first().waitFor()
            await page.addStyleTag({content: '.model-showcase-card { content-visibility: visible !important; contain-intrinsic-size: auto !important; }'})
            await page.evaluate(async () => { await document.fonts.ready; await Promise.all([...document.images].map(img => img.complete ? Promise.resolve() : new Promise(resolve => { img.onload=resolve; img.onerror=resolve }))) })
            const illustrated = await page.locator('.curated-model-grid .ofertamatica-custom-header img').count()
            if (illustrated < 6) throw new Error('Cabeçalhos ilustrados ausentes: ' + illustrated)
            const rejectCookies = page.getByRole('button', {name:/Rejeitar opcionais/i})
            if (await rejectCookies.isVisible()) await rejectCookies.click()
            await page.screenshot({path: 'artifacts/design-audit/sazonais-' + name + '.png', fullPage: true})
            await page.getByRole('button', {name:'Black Friday', exact:true}).click()
            await page.screenshot({path: 'artifacts/design-audit/black-friday-filtrada-' + name + '.png', fullPage: true})
            const visible = await page.locator('.curated-model-grid .model-showcase-card').count()
            if (visible !== 2) throw new Error('Esperados dois modelos Black Friday, obtidos ' + visible)
            await page.close()
          }
          await browser.close()
          EOF
      - name: Web Design Guidelines - responsive and keyboard audit
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: npm run qa:design
      - name: Verify poster typography, consent and key interactions
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: node scripts/qa-interactions.mjs
      # CLI oficial: snapshots semânticos e capturas reais, complementares
      # aos testes automatizados via API Playwright acima.
      - name: Verify A4 A3 SRA3 and App PDF physical print
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: node scripts/qa-release-print-import.mjs

      - name: Check four editor tabs and mobile navigation at 360px
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: node scripts/capture-mobile-editor.mjs

      - name: Capture public pages and check unclipped format cards
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: node scripts/capture-site-visuals.mjs

      - name: Install Microsoft Playwright CLI
        run: npm install -g @playwright/cli@latest

      - name: Inspect mobile models using Playwright CLI
        run: |
          set -euo pipefail
          mkdir -p artifacts/design-audit
          trap 'playwright-cli -s=oferta-design close >/dev/null 2>&1 || true' EXIT
          playwright-cli -s=oferta-design open http://127.0.0.1:5183/modelos/
          playwright-cli -s=oferta-design resize 390 844
          playwright-cli -s=oferta-design snapshot --filename=artifacts/design-audit/cli-modelos-mobile.yaml
          playwright-cli -s=oferta-design screenshot --filename=artifacts/design-audit/cli-modelos-mobile.png
          test -s artifacts/design-audit/cli-modelos-mobile.yaml
          test -s artifacts/design-audit/cli-modelos-mobile.png

      - name: Upload design audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofertamatica-design-audit
          path: |
            artifacts/design-audit/
            screenshots/print-qa/
          if-no-files-found: warn
          retention-days: 30
