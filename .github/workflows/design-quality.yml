name: Ofertamatica Design Quality

on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/qa-design-guidelines.mjs'
      - 'scripts/qa-release-print-import.mjs'
      - 'package.json'
      - 'DESIGN.md'
      - 'AGENTS.md'
      - '.github/workflows/design-quality.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/qa-design-guidelines.mjs'
      - 'package.json'
      - '.github/workflows/design-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build and validate
        run: npm run verify
      - name: Install browser testing dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 5183 > /tmp/ofertamatica-design-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5183/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ofertamatica-design-preview.log
          exit 1
      - name: Web Design Guidelines - responsive and keyboard audit
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: npm run qa:design
      - name: Verify poster typography, consent and key interactions
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: node scripts/qa-interactions.mjs
      # CLI oficial: snapshots semânticos e capturas reais, complementares
      # aos testes automatizados via API Playwright acima.
      - name: Verify A4 A3 SRA3 and App PDF physical print
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: node scripts/qa-release-print-import.mjs

      - name: Install Microsoft Playwright CLI
        run: npm install -g @playwright/cli@latest

      - name: Inspect mobile models using Playwright CLI
        run: |
          set -euo pipefail
          mkdir -p artifacts/design-audit
          trap 'playwright-cli -s=oferta-design close >/dev/null 2>&1 || true' EXIT
          playwright-cli -s=oferta-design open http://127.0.0.1:5183/modelos/
          playwright-cli -s=oferta-design resize 390 844
          playwright-cli -s=oferta-design snapshot --filename=artifacts/design-audit/cli-modelos-mobile.yaml
          playwright-cli -s=oferta-design screenshot --filename=artifacts/design-audit/cli-modelos-mobile.png
          test -s artifacts/design-audit/cli-modelos-mobile.yaml
          test -s artifacts/design-audit/cli-modelos-mobile.png

      - name: Upload design audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofertamatica-design-audit
          path: |
            artifacts/design-audit/
            screenshots/print-qa/
          if-no-files-found: warn
          retention-days: 30
