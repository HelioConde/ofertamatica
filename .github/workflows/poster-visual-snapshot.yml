name: Poster Visual Snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/components/posters/**'
      - 'src/config/posterTemplates.js'
      - 'src/config/posterModelPresets.js'
      - 'src/poster-engine/**'
      - 'src/utils/posterBrowserMeasure.js'
      - 'src/utils/optimizePosterImage.js'
      - 'src/styles/posters.css'
      - 'src/styles.css'
      - 'src/styles/marketing.css'
      - 'src/components/SiteMarketing.jsx'
      - 'src/seo/seoPages.js'
      - 'scripts/validate-build.mjs'
      - 'src/components/FormatOptionCard.jsx'
      - 'src/pages/PosterVisualQaPage.jsx'
      - 'src/App.jsx'
      - 'src/CreatorApp.jsx'
      - 'src/main.jsx'
      - 'src/styles/home.css'
      - 'src/assets/fonts/**'
      - 'scripts/capture-poster-visuals.mjs'
      - 'scripts/capture-site-visuals.mjs'
      - 'scripts/qa-interactions.mjs'
      - 'scripts/capture-mobile-editor.mjs'
      - 'scripts/capture-desktop-editor.mjs'
      - '.github/workflows/poster-visual-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: ofertamatica-poster-visual-snapshot
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Validate product parser
        run: node scripts/validate-parser.mjs

      - name: Install Playwright for visual capture
        run: npm install --no-save playwright@1.55.0

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ofertamatica-poster-playwright-1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build visual QA version
        run: npm run build

      - name: Start local preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 5183 > /tmp/ofertamatica-poster-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5183/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ofertamatica-poster-preview.log
          exit 1

      - name: Verify key user journeys
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
        run: node scripts/qa-interactions.mjs

      - name: Capture poster screenshots
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/capture-poster-visuals.mjs

      - name: Capture site screenshots
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/capture-site-visuals.mjs

      - name: Capture mobile editor screenshots
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/capture-mobile-editor.mjs

      - name: Capture desktop editor screenshots
        env:
          CAPTURE_BASE_URL: http://127.0.0.1:5183
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/capture-desktop-editor.mjs

      - name: Upload visual artifact
        uses: actions/upload-artifact@v4
        with:
          name: ofertamatica-visual-snapshot
          path: screenshots/
          retention-days: 30

      - name: Commit latest screenshots
        run: |
          set -euo pipefail

          SNAPSHOT_TMP="$(mktemp -d)"
          cp -a screenshots/. "$SNAPSHOT_TMP"/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Poster snapshot push attempt $attempt/3"
            git fetch origin main
            git reset --hard origin/main

            rm -rf screenshots
            mkdir -p screenshots
            cp -a "$SNAPSHOT_TMP"/. screenshots/

            git add screenshots/
            if git diff --cached --quiet; then
              echo "No visual changes detected."
              exit 0
            fi

            git commit -m "chore: refresh ofertamatica visual snapshots [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "Could not publish snapshots to main after 3 attempts. The visual artifact was already uploaded, so QA stays valid."
          exit 0
